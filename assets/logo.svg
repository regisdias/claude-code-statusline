    <line x1="56" y1="44" x2="104" y2="44" stroke="#21262d"/>
    <line x1="56" y1="44" x2="88" y2="44" stroke="#3fb950"/>

    <line x1="26" y1="76" x2="104" y2="76" stroke="#21262d"/>
    <line x1="26" y1="76" x2="82" y2="76" stroke="#d29922"/>

    <line x1="26" y1="100" x2="104" y2="100" stroke="#21262d"/>
    <line x1="26" y1="100" x2="96" y2="100" stroke="#f85149"/>
  </g>
</svg>
