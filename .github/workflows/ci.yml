name: CI

on:
  push:
    branches: [main, stg, develop]
  pull_request:
    branches: [main, stg, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint every shell script
        run: shellcheck --severity=warning statusline-command.sh install.sh scripts/testar.sh hooks/ccsl-update-check.sh

  powershell:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Analyse the PowerShell files
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          # -Path takes one path, not a list: loop instead of passing an array
          $achados = @('statusline-command.ps1', 'hooks/ccsl-update-check.ps1') | ForEach-Object {
              Invoke-ScriptAnalyzer -Path $_ -Severity Error,Warning
          }
          if ($achados) { $achados | Format-Table -AutoSize | Out-String | Write-Host; exit 1 }
          Write-Host 'sem achados'

  versao:
    name: Versions agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # CCSL_VERSION is what the update check compares against. If the two
      # implementations drift, or the release stamp forgets one of them, the
      # notice lies about what is installed.
      - name: CCSL_VERSION matches across both scripts and the CHANGELOG
        run: |
          # The .ps1 is checked out with CRLF (see .gitattributes), so the CR has to
          # go before sed anchors with $, not after.
          sh=$(tr -d '\r' < statusline-command.sh | sed -n 's/^CCSL_VERSION="\(.*\)"$/\1/p')
          ps=$(tr -d '\r' < statusline-command.ps1 | sed -n "s/^\$CCSL_VERSION = '\(.*\)'$/\1/p")
          log=$(sed -n 's/^## \[\([0-9][0-9.]*\)\].*/\1/p' CHANGELOG.md | head -n1)

          echo "statusline-command.sh  $sh"
          echo "statusline-command.ps1 $ps"
          echo "CHANGELOG.md           $log"

          [ -n "$sh" ] && [ -n "$ps" ] && [ -n "$log" ] || { echo "faltou extrair alguma"; exit 1; }
          [ "$sh" = "$ps" ] || { echo "as duas implementações discordam"; exit 1; }
          [ "$sh" = "$log" ] || { echo "os scripts não batem com a última versão do CHANGELOG"; exit 1; }
          echo ok

  bom:
    name: UTF-8 BOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Without the BOM, Windows PowerShell 5.1 reads the file as ANSI and the
      # block characters break the parser before the script ever runs.
      - name: every .ps1 must keep its BOM
        run: |
          for f in statusline-command.ps1 hooks/ccsl-update-check.ps1; do
            bom=$(head -c3 "$f" | od -An -tx1 | tr -d ' \n')
            [ "$bom" = "efbbbf" ] || { echo "BOM ausente em $f: $bom"; exit 1; }
            echo "ok $f"
          done

  paridade:
    name: Same bytes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install jq
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew list jq >/dev/null 2>&1 || brew install jq
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq jq
          fi
      # The runner image ships no comma-decimal locale, and testar.sh skips the
      # locale case without one (#27). macOS has them out of the box.
      - name: Generate comma-decimal locales
        if: runner.os == 'Linux'
        run: sudo locale-gen pt_BR.UTF-8 de_DE.UTF-8
      - name: shell vs PowerShell, byte for byte
        run: bash scripts/testar.sh

  windows:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Render every payload
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem scripts/payloads/*.json | ForEach-Object {
              $saida = Get-Content $_.FullName -Raw |
                  powershell -NoProfile -ExecutionPolicy Bypass -File .\statusline-command.ps1
              if ([string]::IsNullOrWhiteSpace($saida)) {
                  Write-Host "FALHA $($_.Name): saída vazia"
                  exit 1
              }
              Write-Host "ok $($_.Name): $saida"
          }

  imagens:
    name: README images are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq
      # The SVGs are rendered from the script's real output, never hand-drawn.
      # A format change that forgets to regenerate them leaves the README
      # advertising a bar the script no longer prints.
      - name: Committed images match the current output
        run: python3 scripts/gerar-svg.py --verificar

      - name: Committed images are well-formed SVG
        run: |
          for svg in assets/*.svg; do
            python3 -c "import sys, xml.dom.minidom as m; m.parse(sys.argv[1])" "$svg"
            echo "ok $svg"
          done
